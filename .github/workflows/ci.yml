name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  assets:
    name: Lint JS/CSS + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      # GUARD: падает, если SCSS/JS-бандлы (тема + кастомные блоки) не собираются.
      - run: npm run build:prod
